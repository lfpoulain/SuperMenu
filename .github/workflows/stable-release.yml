name: Stable Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-stable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win32
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Windows stable version
        id: metadata
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Stable tags must use the exact vMAJOR.MINOR.PATCH format"
          }

          $appVersion = $Matches[1]
          $declaredVersion = (Get-Content -LiteralPath "VERSION" -Raw).Trim()
          if ($appVersion -ne $declaredVersion) {
            throw "Tag version $appVersion does not match win32/VERSION ($declaredVersion)"
          }

          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/pyproject.toml
            win32/requirements.txt
            win32/requirements-dev.txt

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate source
        shell: powershell
        run: |
          python -m compileall -q ../shared/supermenu_core src run.py
          python -m pytest -q ../shared/tests
          python -m pytest -q tests
          python -m flake8 ../shared/supermenu_core src tests run.py --select=F,E9

      - name: Inject Windows stable metadata
        shell: powershell
        run: |
          @(
            '"""Build metadata overwritten by GitHub Actions for packaged releases."""'
            ''
            "APP_VERSION = `"$env:APP_VERSION`""
            'BUILD_CHANNEL = "stable"'
          ) | Set-Content -LiteralPath "src/config/build_info.py" -Encoding utf8

      - name: Build portable executable
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean SuperMenu.spec
          if (!(Test-Path -LiteralPath "dist/SuperMenu.exe")) {
            throw "dist/SuperMenu.exe not found"
          }

          $smoke = Start-Process -FilePath "dist/SuperMenu.exe" -ArgumentList "--smoke-test" -WindowStyle Hidden -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($smoke.ExitCode)"
          }

          Copy-Item -LiteralPath "dist/SuperMenu.exe" -Destination "SuperMenu.exe"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build stable installer
        shell: powershell
        run: |
          iscc "setup_supermenu.iss" "/DMyAppVersion=$env:APP_VERSION" "/DMyOutputBaseFilename=SuperMenu_Setup"
          if (!(Test-Path -LiteralPath "SuperMenu_Setup.exe")) {
            throw "SuperMenu_Setup.exe not found"
          }

      - name: Preserve Windows stable artifacts
        uses: actions/upload-artifact@v6
        with:
          name: stable-windows
          path: |
            win32/SuperMenu.exe
            win32/SuperMenu_Setup.exe
          if-no-files-found: error
          retention-days: 30

  build-macos-stable:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    outputs:
      app_version: ${{ steps.metadata.outputs.app_version }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare macOS stable metadata
        id: metadata
        run: |
          app_version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "macos/VERSION must contain a SemVer version such as 1.2.0" >&2
            exit 1
          fi

          echo "APP_VERSION=${app_version}" >> "${GITHUB_ENV}"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/pyproject.toml
            macos/requirements.txt
            macos/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q ../shared/supermenu_core src run.py
          python -m pytest -q ../shared/tests
          python -m pytest -q tests
          python -m flake8 ../shared/supermenu_core src tests run.py --select=F,E9
          python run.py --smoke-test

      - name: Inject macOS stable metadata
        run: |
          printf '%s\n' \
            '"""Build metadata overwritten by GitHub Actions for packaged releases."""' \
            '' \
            "APP_VERSION = \"${APP_VERSION}\"" \
            'BUILD_CHANNEL = "stable"' \
            > src/config/build_info.py

      - name: Configure required Developer ID signing
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          required=(
            MACOS_CERTIFICATE_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_APPLE_ID
            MACOS_APP_PASSWORD
            MACOS_TEAM_ID
          )
          missing=()
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              missing+=("${variable_name}")
            fi
          done
          if [[ "${#missing[@]}" -ne 0 ]]; then
            printf 'Configuration Apple incomplète. Secrets absents : %s\n' "${missing[*]}" >&2
            exit 1
          fi

          certificate_path="${RUNNER_TEMP}/supermenu-developer-id.p12"
          keychain_path="${RUNNER_TEMP}/supermenu-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "${MACOS_CERTIFICATE_BASE64}" | base64 --decode -o "${certificate_path}"

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"

          identity="$(security find-identity -v -p codesigning "${keychain_path}" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "${identity}" ]]; then
            echo "Le fichier P12 ne contient aucune identité Developer ID Application valide." >&2
            exit 1
          fi

          echo "MACOS_CODESIGN_IDENTITY=${identity}" >> "${GITHUB_ENV}"
          echo "MACOS_KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"

      - name: Build, sign and notarize app and DMG
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          chmod +x scripts/*.sh
          scripts/build_dmg.sh
          scripts/notarize_dmg.sh
          cp \
            "dist/SuperMenu-${APP_VERSION}-macOS-arm64.dmg" \
            "dist/SuperMenu-macOS-arm64.dmg"

      - name: Preserve signed and notarized macOS stable artifact
        uses: actions/upload-artifact@v6
        with:
          name: stable-macos
          path: macos/dist/SuperMenu-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing keychain
        if: always()
        run: |
          keychain_path="${MACOS_KEYCHAIN_PATH:-${RUNNER_TEMP}/supermenu-signing.keychain-db}"
          security delete-keychain "${keychain_path}" 2>/dev/null || true
          rm -f "${RUNNER_TEMP}/supermenu-developer-id.p12"

  publish-stable:
    needs:
      - build-windows-stable
      - build-macos-stable
    runs-on: ubuntu-latest
    env:
      WINDOWS_VERSION: ${{ needs.build-windows-stable.outputs.app_version }}
      MACOS_VERSION: ${{ needs.build-macos-stable.outputs.app_version }}

    steps:
      - name: Download Windows stable artifacts
        uses: actions/download-artifact@v6
        with:
          name: stable-windows
          path: release-assets

      - name: Download macOS stable artifact
        uses: actions/download-artifact@v6
        with:
          name: stable-macos
          path: release-assets

      - name: Generate platform manifests and checksums
        working-directory: release-assets
        run: |
          jq -n \
            --arg version "${WINDOWS_VERSION}" \
            --arg tag "${GITHUB_REF_NAME}" \
            '{schema_version: 1, channel: "stable", version: $version, prerelease: false, tag: $tag}' \
            > update-stable.json

          jq -n \
            --arg version "${MACOS_VERSION}" \
            --arg tag "${GITHUB_REF_NAME}" \
            '{schema_version: 1, platform: "macos", architecture: "arm64", channel: "stable", version: $version, prerelease: false, tag: $tag, asset: "SuperMenu-macOS-arm64.dmg"}' \
            > update-macos-stable.json

          sha256sum \
            SuperMenu.exe \
            SuperMenu_Setup.exe \
            SuperMenu-macOS-arm64.dmg \
            update-stable.json \
            update-macos-stable.json \
            > SHA256SUMS.txt

      - name: Publish immutable stable release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: SuperMenu ${{ env.WINDOWS_VERSION }}
          makeLatest: true
          immutableCreate: true
          allowUpdates: true
          updateOnlyUnreleased: true
          artifactErrorsFailBuild: true
          artifacts: release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Release stable officielle de SuperMenu.

            Channel: stable
            Windows version: ${{ env.WINDOWS_VERSION }}
            macOS version: ${{ env.MACOS_VERSION }}
            Commit: ${{ github.sha }}

            Windows : exécutable portable et installateur.
            macOS Apple Silicon : DMG signé Developer ID et notarisé par Apple.

            Cette version est recommandée pour une utilisation quotidienne.
