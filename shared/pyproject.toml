[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supermenu-core"
version = "0.1.0"
description = "Shared application core for SuperMenu on macOS and Windows"
readme = "README.md"
# SPDX identifier; the full terms are in LICENSE at the repository root.
# The table form is kept for setuptools < 77, which rejects a bare string.
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.11,<7",
    "requests>=2.34,<3",
    "websocket-client==1.9.2",
    "pyqtdarktheme==0.1.7",
    "audioop-lts>=0.2.2; python_version >= '3.13'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["supermenu_core*"]
